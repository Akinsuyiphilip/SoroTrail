name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sorotrail
          POSTGRES_PASSWORD: sorotrail
          POSTGRES_DB: sorotrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sorotrail"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (with Postgres integration tests)
        # -p 1 serializes packages: the integration tests in internal/store
        # and internal/replay share one database and truncate the same tables.
        run: go test -p 1 ./... -count=1
        env:
          TEST_DATABASE_URL: postgres://sorotrail:sorotrail@localhost:5432/sorotrail?sslmode=disable

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.0
      - name: Helm lint
        run: helm lint deploy/helm/sorotrail --set database.url=postgres://user:pass@host:5432/db
      - name: Helm template render
        run: helm template sorotrail deploy/helm/sorotrail --set database.url=postgres://user:pass@host:5432/db > /dev/null

  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # promtool ships with Prometheus; pin a release here the same way
      # the lint job pins golangci-lint rather than tracking latest.
      - name: Install promtool
        env:
          PROM_VERSION: 3.15.0
        run: |
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" -o /tmp/prometheus.tar.gz
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version
      # No secrets and no running Prometheus: promtool parses and unit-tests
      # the rule file in-process, and the script cross-checks every metric
      # the rules and the dashboard reference against the list of metrics
      # this project exports, so a renamed or deleted metric fails here
      # instead of shipping as a silently dead alert or blank panel.
      - name: Validate Prometheus rules and Grafana dashboard
        run: make check-monitoring
